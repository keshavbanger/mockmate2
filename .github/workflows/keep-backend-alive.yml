name: Keep Render backend alive

# Render's free tier spins the backend down after ~15 minutes of inactivity,
# and a cold restart of this specific Spring Boot app takes ~135 seconds
# (measured from live Render logs — JVM warm-up + Hibernate/JPA init +
# connection pooling + loading problem banks at startup). That's the "Network
# Error" / stuck "Loading MockMate..." users were hitting on login. Pinging
# /health every 10 minutes — inside Render's 15-minute idle window — keeps
# the instance warm so real users rarely hit a cold start at all.
#
# GitHub Actions cron schedules are best-effort, not guaranteed to the
# minute, and only run on this repo's default branch — treat this as a
# strong mitigation, not a guarantee cold starts never happen (e.g. after
# GitHub Actions itself has a delay, or Render redeploys the service).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf -o /dev/null -w "Backend responded: %{http_code}\n" https://mockmate-backend-io2l.onrender.com/health
