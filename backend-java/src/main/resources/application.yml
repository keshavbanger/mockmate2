server:
  port: ${PORT:8080}

spring:
  application:
    name: mockmate
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: true
      connection-test-query: SELECT 1
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      validation-timeout: 3000
      keepalive-time: 45000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # Gmail SMTP — used instead of Resend since Resend requires a verified
  # custom domain to send to anyone other than the account owner, and this
  # project doesn't have one. A personal Gmail account can send to any
  # recipient today via an App Password, no domain needed.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SMTP_USERNAME:}
    password: ${GMAIL_SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Config — JWT_SECRET must be set in the environment (.env locally); no
# fallback default so the app fails fast instead of signing with a secret
# that's been committed to source control.
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# Supabase Config
supabase:
  jwks-url: https://sslnbmgjgxcztqtzeonj.supabase.co/auth/v1/.well-known/jwks.json

# External APIs
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:MockMate <onboarding@resend.dev>}

# SendGrid — active email sender. HTTP API (port 443), unlike Gmail SMTP
# (port 587), which Render's free tier blocks outbound entirely.
sendgrid:
  api-key: ${SENDGRID_API_KEY:}
  from-email: ${SENDGRID_FROM_EMAIL:}

tavus:
  api-key: ${TAVUS_API_KEY:}
  replica-id: ${TAVUS_REPLICA_ID:r291e545fd67}
sarvam:
  api-key: ${SARVAM_API_KEY:}
gemini:
  api-key: ${GEMINI_API_KEY:}
groq:
  api-key: ${GROQ_API_KEY:}
  # Only read by GroqLlmProvider (AI Interview Engine beta) — every other
  # Groq caller in this codebase hardcodes its own model name and is
  # untouched by this key. llama-3.3-70b-versatile was retired from Groq's
  # catalog (confirmed via GET /v1/models); openai/gpt-oss-20b is a fast,
  # currently-available model well suited to a live conversational turn.
  model: ${GROQ_MODEL:openai/gpt-oss-20b}
# Last-resort fallback for the tech-interview AI calls (conversation, plan
# generation, report generation) — tried only after every Groq model/attempt
# has already failed. Groq's rate limit is shared across all Groq models on
# one API key, so a same-provider fallback gives no protection against Groq
# itself being rate-limited or down; OpenRouter is a separate provider.
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openai/gpt-oss-20b:free}
code:
  execution:
    # judge0 (Judge0's own sandboxed infra) or piston (self-hosted,
    # docker-compose.piston.yml) are both real sandboxes and should be used
    # once JUDGE0_API_KEY / a reachable PISTON_URL are actually available —
    # set CODE_EXECUTION_PROVIDER explicitly to switch once that's in place.
    # Defaulting to inapp for now since neither is configured yet: it runs
    # candidate code as raw OS subprocesses on this server with no container
    # isolation (see InAppExecutionProvider's runCommand — env vars are at
    # least stripped so submitted code can't read our secrets, but this is
    # a stopgap, not a real sandbox).
    provider: ${CODE_EXECUTION_PROVIDER:inapp}

judge0:
  base-url: ${JUDGE0_BASE_URL:https://judge0-ce.p.rapidapi.com}
  api-key: ${JUDGE0_API_KEY:}
  api-host: ${JUDGE0_API_HOST:judge0-ce.p.rapidapi.com}

piston:
  # Legacy Piston fallback config
  url: ${PISTON_URL:http://localhost:2000/api/v2/execute}

app:
  # Comma-separated emails auto-promoted to ADMIN on login/signup (see
  # AuthService.promoteIfConfiguredAdmin) — bootstraps the first admin
  # without a manual DB write. Further admins can be promoted afterward
  # from the admin panel itself.
  admin-emails: ${ADMIN_EMAILS:}
