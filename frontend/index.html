<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>MockMate AI — Practice AI Technical & DSA Interviews</title>
    <meta name="title" content="MockMate AI — Practice AI Technical & DSA Interviews" />
    <meta name="description" content="MockMate AI is an enterprise-grade AI technical interview platform. Practice real-time DSA coding assessments, system design interviews, and technical evaluations with instant AI feedback." />
    <meta name="keywords" content="MockMate, MockMate AI, AI interview, technical interview practice, DSA practice, coding interview simulator, system design interview" />
    <meta name="author" content="MockMate AI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.mockmate.live/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mockmate.live/" />
    <meta property="og:title" content="MockMate AI — Practice AI Technical & DSA Interviews" />
    <meta property="og:description" content="Enterprise-grade AI technical interview simulator. Real-time DSA execution sandbox, dynamic adaptive interviews, and detailed scorecards." />
    <meta property="og:image" content="https://www.mockmate.live/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.mockmate.live/" />
    <meta property="twitter:title" content="MockMate AI — Practice AI Technical & DSA Interviews" />
    <meta property="twitter:description" content="Enterprise-grade AI technical interview simulator. Real-time DSA execution sandbox, dynamic adaptive interviews, and detailed scorecards." />

    <!-- Fonts & Favicon -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Google's favicon guidelines want a square icon that's at least
         48px — the 32x32 above falls just short of that, and favicon.png
         below has no declared size for a crawler to go on without
         fetching and decoding it. This one exists on disk already but
         wasn't referenced anywhere. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Structured data: names the entity explicitly as "MockMate AI" at
         this exact domain, separate from unrelated same-name products
         (mockmate.com, mock-mate.com, mockmateai.app) that were outranking
         this brand-new domain in search before it had any indexed pages of
         its own to disambiguate against. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MockMate AI",
      "url": "https://www.mockmate.live/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered interview preparation platform: mock behavioral interviews, a live Technical Interview Lab with real-time DSA coding execution, an ATS resume checker, and an ATS-friendly resume builder.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "MockMate AI",
        "url": "https://www.mockmate.live/"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MockMate AI",
      "url": "https://www.mockmate.live/"
    }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
